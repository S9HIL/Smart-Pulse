<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Glowing effect -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Animated gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#a2d2ff;#ffffff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a2d2ff">
        <animate attributeName="stop-color" values="#a2d2ff;#ffffff;#a2d2ff" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="white" stroke-width="2">
    <animate attributeName="r" values="35;37;35" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animated pulsing circle -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="0.75" opacity="0.6">
    <animate attributeName="r" values="38;40;38" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- "SP" text with gradient fill -->
  <text x="40" y="48" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)">SP</text>
  
  <!-- Rotating circular line -->
  <g>
    <circle cx="40" cy="40" r="30" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="1,5" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Flashing outline effect -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="white" stroke-width="1">
    <animate attributeName="stroke-width" values="0.5;1.5;0.5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>