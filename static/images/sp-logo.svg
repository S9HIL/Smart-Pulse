<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definition -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007bff">
        <animate attributeName="stop-color" 
          values="#007bff; #6f42c1; #28a745; #fd7e14; #dc3545; #007bff" 
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6f42c1">
        <animate attributeName="stop-color" 
          values="#6f42c1; #28a745; #fd7e14; #dc3545; #007bff; #6f42c1" 
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="url(#logoGradient)" stroke-width="2">
    <animate attributeName="stroke-dasharray" 
             values="0 240; 240 0; 0 240" 
             dur="6s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- S letter -->
  <path id="S-letter" d="M25 25 C18 25, 18 30, 25 35 C32 40, 32 45, 25 50 C18 55, 15 50, 15 45" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dasharray" 
             values="0 100; 100 0" 
             dur="3s" 
             repeatCount="1"/>
  </path>
  
  <!-- P letter -->
  <path id="P-letter" d="M45 25 L45 55 M45 25 C55 25, 65 30, 55 40 C45 50, 45 40, 45 40" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dasharray" 
             values="0 100; 100 0" 
             dur="3s"
             begin="1s" 
             repeatCount="1"/>
  </path>
  
  <!-- Pulsating animation -->
  <animate xlink:href="#S-letter" 
           attributeName="stroke-width" 
           values="4;5;4" 
           dur="2s" 
           repeatCount="indefinite"/>
  <animate xlink:href="#P-letter" 
           attributeName="stroke-width" 
           values="4;5;4" 
           dur="2s" 
           repeatCount="indefinite"/>
</svg>