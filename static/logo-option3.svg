<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Pulsing glow filter -->
    <filter id="pulsing-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2;4;2" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Futuristic square background -->
  <rect x="15" y="15" width="50" height="50" rx="10" fill="none" stroke="white" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- "S" Letter - Tech Style -->
  <path d="M30,30 C36,30 40,32 40,37 C40,42 34,44 34,47 C34,50 38,52 44,50" 
        stroke="white" fill="none" stroke-width="4" stroke-linecap="round"
        filter="url(#pulsing-glow)"/>
        
  <!-- "P" Letter - Tech Style -->
  <path d="M45,30 L45,54 M45,30 C52,30 55,33 55,38 C55,43 52,46 45,46" 
        stroke="white" fill="none" stroke-width="4" stroke-linecap="round"
        filter="url(#pulsing-glow)"/>
  
  <!-- Animated circuit-like lines -->
  <g stroke="white" stroke-width="1" opacity="0.7">
    <!-- Horizontal lines -->
    <line x1="10" y1="20" x2="14" y2="20">
      <animate attributeName="x2" values="14;20;14" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="10" y1="40" x2="14" y2="40">
      <animate attributeName="x2" values="14;17;14" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="10" y1="60" x2="14" y2="60">
      <animate attributeName="x2" values="14;18;14" dur="5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Vertical lines -->
    <line x1="20" y1="10" x2="20" y2="14">
      <animate attributeName="y2" values="14;19;14" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="10" x2="40" y2="14">
      <animate attributeName="y2" values="14;17;14" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="10" x2="60" y2="14">
      <animate attributeName="y2" values="14;18;14" dur="5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Bottom lines -->
    <line x1="20" y1="70" x2="20" y2="66">
      <animate attributeName="y1" values="70;65;70" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="70" x2="40" y2="66">
      <animate attributeName="y1" values="70;64;70" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="70" x2="60" y2="66">
      <animate attributeName="y1" values="70;67;70" dur="5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Right lines -->
    <line x1="70" y1="20" x2="66" y2="20">
      <animate attributeName="x1" values="70;65;70" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="40" x2="66" y2="40">
      <animate attributeName="x1" values="70;64;70" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="60" x2="66" y2="60">
      <animate attributeName="x1" values="70;67;70" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Flashing corner dots -->
  <circle cx="15" cy="15" r="2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="15" r="2" fill="white">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="65" r="2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="65" r="2" fill="white">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>