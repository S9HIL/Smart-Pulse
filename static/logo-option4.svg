<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <!-- Glow effect for text -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Pulse animation for outer ring -->
    <filter id="pulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur">
        <animate attributeName="stdDeviation" values="1;3;1" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Circular background with double border -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="32" fill="none" stroke="white" stroke-width="0.5"/>
  
  <!-- Pulsing outer ring -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="0.8" filter="url(#pulse)">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Stylized "S" letter -->
  <path d="M28,32 C35,28 42,32 40,38 C38,44 30,43 28,48 C26,53 32,53 38,50" 
        stroke="white" fill="none" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)"/>
  
  <!-- Stylized "P" letter -->
  <path d="M44,30 L44,55 M44,30 C54,30 58,35 56,40 C54,45 48,44 44,44" 
        stroke="white" fill="none" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)"/>
  
  <!-- Rotating dots around the circle -->
  <g>
    <circle cx="40" cy="5" r="1.5" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="5" r="1" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="60 40 40" to="420 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="5" r="1" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="120 40 40" to="480 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="5" r="1.5" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="180 40 40" to="540 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="5" r="1" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="240 40 40" to="600 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="5" r="1" fill="white">
      <animateTransform attributeName="transform" type="rotate" from="300 40 40" to="660 40 40" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Flashing line animation -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="white" stroke-width="0.3" stroke-dasharray="1,8">
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="-360 40 40" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>