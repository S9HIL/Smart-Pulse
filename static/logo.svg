<?xml version="1.0" encoding="UTF-8"?>
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="white" stroke-width="2" />
  
  <!-- "S" and "P" letters -->
  <text x="40" y="48" font-family="Arial Black, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">SP</text>
  
  <!-- Animated flashing outline -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1;3;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Flowing line animation -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="2" stroke-dasharray="2,30" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite" />
  </circle>
</svg>