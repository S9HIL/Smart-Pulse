<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sʌʜɩɭ Pʀʌjʌpʌtɩ Hub{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom animations CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main {
            flex: 1;
        }
        
        .navbar-brand {
            font-weight: 700;
        }
        
        .message-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--bs-border-color);
            border-radius: 0.25rem;
        }
        
        /* Owner name animation styles */
        .animated-owner-name {
            font-size: 1.2rem;
            font-weight: 600;
            display: inline-block;
            background: linear-gradient(90deg, #007bff, #6f42c1, #28a745, #fd7e14, #dc3545, #007bff);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-animation 6s linear infinite;
            text-shadow: none;
            margin-left: 10px;
        }
        
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        
        /* Letter animation */
        .animated-letter {
            display: inline-block;
            transform-origin: center bottom;
            animation: floating 3s ease-in-out infinite;
            animation-delay: calc(var(--letter-index) * 0.1s);
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand logo-hover-effect" href="{{ url_for('main.index') }}">
                <span class="sp-logo-text">SP</span>
                <span style="vertical-align: middle;">Sʌʜɩɭ Pʀʌjʌpʌtɩ Hub</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == url_for('main.index') %}active{% endif %}" href="{{ url_for('main.index') }}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/whatsapp' in request.path %}active{% endif %}" href="{{ url_for('whatsapp.index') }}">
                            <i class="fab fa-whatsapp me-1"></i> WhatsApp
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/facebook' in request.path %}active{% endif %}" href="{{ url_for('facebook.index') }}">
                            <i class="fab fa-facebook me-1"></i> Facebook
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/instagram' in request.path %}active{% endif %}" href="{{ url_for('instagram.index') }}">
                            <i class="fab fa-instagram me-1"></i> Instagram
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/batch-manager' in request.path %}active{% endif %}" href="{{ url_for('main.batch_manager') }}">
                            <i class="fas fa-tasks me-1"></i> Batch Manager
                        </a>
                    </li>
                </ul>
                
                {% if session.username %}
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link">
                            <i class="fas fa-user-circle me-1"></i>
                            {{ session.username }}
                        </span>
                    </li>
                </ul>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-dark text-light py-3">
        <div class="container text-center">
            <div class="mb-3">
                <span>Developed by Sʌʜɩɭ Pʀʌjʌpʌtɩ</span>
            </div>
            <p class="mb-0">&copy; 2025 Automation Hub. All rights reserved. <span id="current-time"></span></p>
        </div>
    </footer>
    
    <script>
    // Update current time based on Indian Standard Time (IST)
    function updateCurrentTime() {
        // Create a date object in UTC
        const now = new Date();
        
        // Convert to Indian Standard Time (IST, UTC+5:30)
        const istOffset = 5.5 * 60 * 60 * 1000; // 5.5 hours in milliseconds
        const utcTime = now.getTime() + (now.getTimezoneOffset() * 60 * 1000);
        const istTime = new Date(utcTime + istOffset);
        
        const timeElement = document.getElementById('current-time');
        if (timeElement) {
            const options = { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: true 
            };
            
            // Format the time including IST label
            const timeString = istTime.toLocaleTimeString(undefined, options);
            timeElement.innerHTML = ` | <strong>IST:</strong> ${timeString}`;
        }
    }
    
    // Update time immediately and then every second
    updateCurrentTime();
    setInterval(updateCurrentTime, 1000);
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
