<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automation Hub{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        main {
            flex: 1;
        }
        
        .navbar-brand {
            font-weight: 700;
        }
        
        .message-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--bs-border-color);
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <i class="fas fa-robot me-2"></i>
                Automation Hub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == url_for('main.index') %}active{% endif %}" href="{{ url_for('main.index') }}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/whatsapp' in request.path %}active{% endif %}" href="{{ url_for('whatsapp.index') }}">
                            <i class="fab fa-whatsapp me-1"></i> WhatsApp
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/facebook' in request.path %}active{% endif %}" href="{{ url_for('facebook.index') }}">
                            <i class="fab fa-facebook me-1"></i> Facebook
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/instagram' in request.path %}active{% endif %}" href="{{ url_for('instagram.index') }}">
                            <i class="fab fa-instagram me-1"></i> Instagram
                        </a>
                    </li>
                </ul>
                
                {% if session.username %}
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link">
                            <i class="fas fa-user-circle me-1"></i>
                            {{ session.username }}
                        </span>
                    </li>
                </ul>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-dark text-light py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 Automation Hub. All rights reserved. <span id="current-time"></span></p>
        </div>
    </footer>
    
    <script>
    // Update current time
    function updateCurrentTime() {
        const now = new Date();
        const timeElement = document.getElementById('current-time');
        if (timeElement) {
            const options = { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: true 
            };
            timeElement.textContent = now.toLocaleTimeString(undefined, options);
        }
    }
    
    // Update time immediately and then every second
    updateCurrentTime();
    setInterval(updateCurrentTime, 1000);
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
